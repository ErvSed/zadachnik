<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Задачник — открываем сайт</title>
  <meta http-equiv="refresh" content="0; url=https://zadachnik.45-81-253-203.sslip.io/" />
  <link rel="canonical" href="https://zadachnik.45-81-253-203.sslip.io/" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2f5bff" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #10141c;
      background: #eef1f6 radial-gradient(900px 400px at 10% -10%, rgba(47, 91, 255, 0.1), transparent 60%) no-repeat;
    }
    .card {
      width: min(420px, 100%);
      padding: 30px 28px;
      border: 1px solid #e2e6ee;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 24px 64px -32px rgba(9, 14, 30, 0.45);
      text-align: center;
    }
    .logo {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border-radius: 14px;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(145deg, #2f5bff, #7247ff 55%, #a043ff);
    }
    h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -0.02em; }
    p { margin: 0; color: #6b7689; font-size: 13.5px; line-height: 1.55; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      margin: 20px 0 14px;
      padding: 0 22px;
      border-radius: 11px;
      background: #2f5bff;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn:hover { background: #1d43d8; }
    .hint { font-size: 11.5px; color: #8b95a7; word-break: break-all; }
    @media (prefers-color-scheme: dark) {
      body { color: #e8ecf3; background-color: #0b0e13; }
      .card { background: #141922; border-color: #232b39; }
      p { color: #8593a8; }
      .hint { color: #6b7689; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">✓</div>
    <h1>Задачник</h1>
    <p>Сейчас откроется рабочий сайт задачника.</p>
    <a class="btn" href="https://zadachnik.45-81-253-203.sslip.io/">Открыть задачник</a>
    <p class="hint">zadachnik.45-81-253-203.sslip.io</p>
  </main>
  <script>
    location.replace('https://zadachnik.45-81-253-203.sslip.io/');
  </script>
</body>
</html>
